<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gorilla Squad – app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Thebes · palette from the Thebes website: brown #1B2517, primary #D0BCFF, purple #836CBB · Inter + Libre Baskerville */
:root{
  --pink:#D0BCFF;--pink-soft:#EFE8FF;--purple:#836CBB;--ink:#1B2517;--ink-2:#1d1d33;--sub:#5a585e;--soft:#F3F1F7;--line:#E6E6E6;--white:#ffffff;
  --green:#14a86a;--green-soft:#dff5ea;--blue-soft:#e2ecfd;--blue:#1e4fb8;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);font-family:Inter,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
#app{position:relative;width:100%;height:100dvh;margin:0 auto;overflow:hidden;background:var(--ink);display:flex;flex-direction:column}
@media (min-width:640px){body{display:flex;align-items:center;justify-content:center;background:#0b0b0b}#app{width:420px;height:min(100dvh - 32px,900px);border-radius:28px;box-shadow:0 30px 80px #000a}}
.view{flex:1;min-height:0;display:none;flex-direction:column}
.view.on{display:flex}
.light{background:var(--white);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* nav */
nav{flex:none;display:flex;justify-content:space-around;align-items:center;height:calc(60px + var(--safe-b));padding-bottom:var(--safe-b);border-top:1px solid #2a2a2a;background:var(--ink)}
#app.is-light nav{background:var(--white);border-top-color:var(--line)}
nav a{width:76px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11px;font-weight:600;color:#9a9a9a}
#app.is-light nav a{color:var(--sub)}
nav a.on{color:var(--white)}
#app.is-light nav a.on{color:var(--ink)}
nav .plus{width:50px;height:34px;border-radius:11px;background:var(--pink);color:var(--ink);display:flex;align-items:center;justify-content:center}
#app.playing nav{display:none}

/* feed */
#feed{position:relative;background:var(--ink);color:var(--white)}
.topbar{position:absolute;z-index:3;left:0;right:0;top:0;padding-top:var(--safe-t);height:calc(50px + var(--safe-t));display:flex;justify-content:center;align-items:center;gap:22px;background:linear-gradient(#1B2517e6,#1B251700);pointer-events:none}
.topbar button{pointer-events:auto;background:none;border:0;padding:12px 2px;font-size:16px;font-weight:600;color:#a3a3a3}
.topbar button.on{color:var(--white);box-shadow:inset 0 -2px 0 var(--pink)}
#app.playing .topbar{display:none}
.slides{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:var(--ink)}
.slide .poster,.slide iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:var(--ink);display:block}
.slide.closed .poster{filter:saturate(.35) brightness(.45)}
.scrim{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(#1B251700,#1B2517ee 72%);pointer-events:none}
.chrome{position:absolute;inset:0;pointer-events:none;transition:opacity .2s}
.chrome>*{pointer-events:auto}
.chrome .scrim{pointer-events:none}
#app.playing .slide.active .chrome{opacity:0;pointer-events:none}
#app.playing .slide.active .chrome>*{pointer-events:none}
.playbtn{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);height:54px;padding:0 30px;border-radius:999px;border:0;background:var(--pink);color:var(--ink);font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px #0008}
.rail{position:absolute;right:10px;bottom:124px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rail .it{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000,0 0 8px #000c}
.rail button{width:48px;height:48px;border-radius:999px;border:0;background:#1B2517bf;color:var(--white);display:flex;align-items:center;justify-content:center}
.rail button.liked{color:var(--pink)}
.rail button.liked svg{fill:var(--pink)}
.faces{display:flex}
.faces span{width:22px;height:22px;border-radius:999px;border:2px solid var(--ink);margin-left:-7px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.faces span:first-child{margin-left:0}
.rail .people{width:auto;min-width:48px;padding:0 8px;border-radius:999px}
.rail .reportbtn{width:auto;height:auto;padding:4px 6px;background:none;color:var(--white);font-size:12px;font-weight:700;opacity:.8;text-shadow:0 1px 3px #000,0 0 8px #000c}
.cap{position:absolute;left:16px;right:78px;bottom:18px;display:flex;flex-direction:column;gap:8px;text-shadow:0 1px 3px #000c}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:38px;height:38px;border-radius:999px;border:2px solid var(--white);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex:none;overflow:hidden;background:var(--pink);color:var(--ink);text-shadow:none}
.av img{width:100%;height:100%;object-fit:cover}
.who b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.follow{height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid var(--white);background:var(--white);color:var(--ink);text-shadow:none;flex:none}
.follow.on{background:transparent;color:var(--white);border-color:#ffffff80}
.cap .t{font-size:16px;font-weight:600;line-height:21px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:26px;padding:0 10px;border-radius:999px;background:#ffffff26;font-size:12px;font-weight:600;display:inline-flex;align-items:center;text-shadow:none}
.chip.pink{background:var(--pink);color:var(--ink)}
.chip.dark{background:var(--ink);color:var(--white);border:1px solid #ffffff40}
.closedcard{position:absolute;left:16px;right:76px;top:calc(76px + var(--safe-t));padding:18px;border-radius:20px;background:#1B2517e6;border:1px solid #ffffff1f;display:flex;flex-direction:column;gap:12px}
.closedcard h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.closedcard .sub{font-size:13px;color:#bdbdbd}
.podium{display:flex;flex-direction:column;gap:6px}
.podium .w{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:12px;background:#ffffff12;font-size:14px}
.podium .w b{width:22px;font-weight:800;color:var(--pink)}
.podium .w span{flex:1;font-weight:600}
.podium .w em{font-style:normal;color:#bdbdbd;font-variant-numeric:tabular-nums}
.playbar{position:absolute;z-index:4;left:0;right:0;top:calc(8px + var(--safe-t));display:none;justify-content:space-between;padding:0 12px;pointer-events:none}
#app.playing .playbar{display:flex}
.pill{pointer-events:auto;height:38px;padding:0 16px;border-radius:999px;border:0;background:#1B2517d9;color:var(--white);font-size:13px;font-weight:700}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(64px + var(--safe-t)) 32px 32px;text-align:center;color:#d4d4d4}
.empty h2{margin:0;font-size:22px;color:var(--white)}

/* sheets */
.veil{position:absolute;inset:0;z-index:10;background:#0009;border:0;display:none}
.sheet{position:absolute;z-index:11;left:0;right:0;bottom:0;max-height:86%;background:var(--white);color:var(--ink);border-radius:22px 22px 0 0;display:none;flex-direction:column;padding:10px 0 var(--safe-b)}
.sheet.tall{height:80%}
.sheet.on,.veil.on{display:flex}
.grab{width:38px;height:5px;border-radius:999px;background:#d4d4d4;align-self:center;flex:none}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 16px 8px}
.sh-head h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.sh-head p{margin:3px 0 0;font-size:13px;color:var(--sub)}
.x{width:36px;height:36px;border-radius:999px;border:0;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--soft)}
.seg button{flex:1;height:38px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:700}
.seg button.on{background:var(--white);box-shadow:0 1px 3px #00000024}
.list{flex:1;overflow:auto;padding:0 16px 12px}
.row{display:grid;grid-template-columns:38px 1fr 56px 64px;align-items:center;min-height:48px;padding:0 12px;font-size:15px;border-top:1px solid var(--soft)}
.row .n{text-align:right;font-weight:700}.row .tm{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.row.me{border:0;border-radius:14px;background:var(--ink);color:var(--white);margin:8px 0}
.row.me .tm{color:#cfcfcf}
.row.you{background:var(--pink-soft)}
.row.hd{min-height:26px;border:0;font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.05em}
.mini{width:28px;height:28px;border-radius:999px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-right:10px;color:var(--ink);flex:none}
.nm{display:flex;align-items:center;font-weight:600;min-width:0}
.nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{font-size:12px;font-weight:700;text-align:right}
.banner{margin:4px 16px 8px;padding:12px 14px;border-radius:14px;background:var(--pink-soft);font-size:14px;line-height:20px}
.banner b{font-weight:800}
.cm{display:flex;gap:12px;padding:10px 0}
.cm .body{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.cm .meta{font-size:12px;color:var(--sub)}.cm .meta b{color:var(--ink);font-weight:700}
.cm .txt{font-size:15px;line-height:21px;overflow-wrap:anywhere}
.composer{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
.composer input{flex:1;height:44px;border-radius:999px;border:0;background:var(--soft);padding:0 16px;font-size:15px;min-width:0}
.btn{height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--ink);color:var(--white);font-size:15px;font-weight:700;flex:none}
.btn.pink{background:var(--pink);color:var(--ink)}
.form{display:flex;flex-direction:column;gap:14px;padding:4px 16px 16px;overflow:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--ink-2)}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--pink)}
.err{color:#b4233c;font-size:13px;font-weight:600}

/* light screens */
.hdr{flex:none;height:calc(56px + var(--safe-t));padding:var(--safe-t) 8px 0;display:flex;align-items:center;justify-content:space-between}
.hdr .ttl{font-size:16px;font-weight:700}
.ib{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;flex:none}
.prog{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 16px}
.prog span{height:4px;border-radius:999px;background:var(--line)}.prog span.on{background:var(--pink)}
.main{flex:1;overflow:auto;padding:22px 16px 24px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:30px;line-height:34px;font-weight:800;letter-spacing:-.02em}
.lede{margin:6px 0 0;font-size:15px;line-height:22px;color:var(--sub)}
.grid2{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:156px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--white);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tile.sel{border:2px solid var(--ink);padding:13px;box-shadow:0 0 0 3px var(--pink-soft)}
.tile[disabled]{opacity:.5}
.marks{display:flex;gap:3px}.marks i{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--ink)}
.tile .n1{font-size:16px;font-weight:700}.tile .n2{font-size:12px;line-height:16px;color:var(--sub)}
.tag{align-self:flex-start;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;background:var(--soft);color:var(--sub);white-space:nowrap}
.tag.live{background:var(--green-soft);color:#0d6b43}.tag.dark{background:var(--ink);color:var(--white)}.tag.pink{background:var(--pink);color:var(--ink)}.tag.blue{background:var(--blue-soft);color:var(--blue)}.tag.red{background:#fde2e2;color:#9b1c1c}
.look{padding:0;border-radius:18px;border:1px solid var(--line);background:var(--white);text-align:left;overflow:hidden;display:flex;flex-direction:column}
.look.sel{border:2px solid var(--ink);box-shadow:0 0 0 3px var(--pink-soft)}
.look img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:var(--soft)}
.look .info{padding:12px;display:flex;flex-direction:column;gap:6px}
.look .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.fld{display:flex;flex-direction:column;gap:8px;min-width:0}
.fld label,.fld .lb{font-size:13px;font-weight:700}
.fld .note{font-size:12px;line-height:16px;color:var(--sub)}
.in{height:48px;border-radius:12px;border:1px solid var(--line);padding:0 14px;font-size:16px;background:var(--white);width:100%;min-width:0}
.in:focus,.composer input:focus{outline:2px solid var(--pink);outline-offset:1px}
textarea.in{height:auto;padding:12px 14px;line-height:22px;resize:vertical}
.upload{height:96px;border-radius:16px;border:1px dashed #9a9a9a;background:#fafafa;display:flex;align-items:center;justify-content:center;gap:14px;text-align:left;width:100%}
.upload.done{border-style:solid;border-color:var(--line)}
.upload img{width:56px;height:56px;border-radius:14px;object-fit:contain;background:var(--soft)}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw label{position:relative;width:42px;height:42px;border-radius:999px;box-shadow:inset 0 0 0 1px #00000024;overflow:hidden;cursor:pointer}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.togs{display:flex;flex-wrap:wrap;gap:8px}
.tog{height:38px;padding:0 15px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--white)}
.tog.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.preview{flex:none;align-self:center;width:72%;max-width:300px;aspect-ratio:9/16;border-radius:24px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 18px 44px #00000029;background:var(--ink);position:relative}
.preview iframe{width:100%;height:100%;border:0;display:block}
.preview .busy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfcfcf;font-size:14px;text-align:center;padding:20px}
.foot{flex:none;padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--soft);display:flex;gap:10px;background:var(--white)}
.cta{flex:1;height:54px;border-radius:14px;border:0;background:var(--pink);color:var(--ink);font-size:16px;font-weight:800}
.cta.ghost{background:var(--white);color:var(--ink);border:1px solid var(--line);font-weight:700}
.cta.dark{background:var(--ink);color:var(--white)}
.cta:disabled{opacity:.5}
.toast{position:absolute;z-index:30;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--white);font-size:14px;font-weight:600;padding:11px 18px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 6px 20px #0004}
.toast.on{opacity:1}

/* profile */
.me{display:flex;align-items:center;gap:16px}
.big{width:72px;height:72px;border-radius:999px;background:var(--pink);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.me .n1{font-size:22px;font-weight:800;letter-spacing:-.01em}.me .n2{font-size:14px;color:var(--sub);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:4px}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--sub)}
.h3{font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.h3 a,.h3 button{font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;background:none;border:0;padding:0}
.played{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.played a{position:relative;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:var(--soft);display:block}
.played img{width:100%;height:100%;object-fit:cover;display:block}
.played span{position:absolute;left:6px;bottom:6px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:800;display:inline-flex;align-items:center}
.co{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:1px solid var(--line)}
.lg{width:46px;height:46px;border-radius:13px;background:var(--pink);color:var(--ink);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.lg img{width:100%;height:100%;object-fit:contain;background:var(--white)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:14px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:6px}
.kpi span{font-size:12px;color:var(--sub)}.kpi b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.cl{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--soft);text-decoration:none}
.cl img{width:44px;height:78px;border-radius:9px;object-fit:cover;flex:none}
.cl .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.cl .tx b{font-size:15px;font-weight:700}.cl .tx span{font-size:12px;color:var(--sub)}
.linkbtn{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--white);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}

/* admin */
.adm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.adm-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--soft);font-size:14px}
.adm-row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.adm-row .tx b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-row .tx span{font-size:12px;color:var(--sub)}
.mbtn{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-size:13px;font-weight:700;flex:none}
.mbtn.red{border-color:#f3c0c0;color:#9b1c1c}
.mselect{height:34px;border-radius:999px;border:1px solid var(--line);padding:0 10px;font-size:13px;font-weight:700;background:var(--white)}
.form .cta{flex:none}

h1,h2,h3,.big,.h3,.ttl{font-family:"Libre Baskerville",Georgia,serif}
.sharebox{margin:4px 16px 12px;border-radius:18px;background:var(--ink);overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:120px}
.sharebox img{display:block;width:100%;max-height:52vh;object-fit:contain}
#sbtn{display:flex;gap:10px;padding:0 16px 14px}
:root{--pink:#CBD6A8;--pink-soft:#E7EDD3;--purple:#5B6F40;--ink:#26331F;--ink-2:#34432b;--sub:#5f6458;--soft:#F1F0E4;--line:#E1E0D0;--green:#4f7a2c;--green-soft:#dfe9c4}
body{background:#0b0f09}
#views{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;position:relative}
.main{width:100%;max-width:640px;margin:0 auto}
.flyer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:92px 28px 0;color:#F1F0E4}
.flyer:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1.5px,transparent 1.6px);background-size:22px 22px}
.flyer>*{position:relative}
.flyer .brand{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.flyer .name{font-family:"Libre Baskerville",Georgia,serif;font-size:30px;line-height:1.2;margin-top:14px;max-width:340px}

<div id="app">
  <div id="views"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);

 if(k==='togglestatus'){const o=offer(id);o.status=o.status==='open'?'paused':'open';return render()}
 if(k==='send'){const v=$('#msg').value.trim();if(!v)return;S.deals.find(d=>d.id===id).msgs.push({f:meId(),t:v});return renderDeal(id)}
 if(k==='report'){const p=$('#dp').value.trim();if(!p)return toast('Add a proof link');S.deals.find(d=>d.id===id).dels.push({id:'x'+(++S.n),kind:'Social post',proof:p,status:'pending',amount:null});toast('Reported. Waiting for the seller to verify.');return renderDeal(id)}
 if(k==='cvup'){S.deals.find(d=>d.id===id).dels.push({id:'x'+(++S.n),kind:'Creator video',proof:'my-review.mp4',video:'0:45',by:'Ada Okafor',status:'pending',amount:null});toast('Creator video uploaded. Waiting for the seller.');return renderDeal(id)}
 if(k==='verifygo'||k==='reject'){let x,d;S.deals.forEach(dd=>dd.dels.forEach(y=>{if(y.id===id){x=y;d=dd}}));const o=offer(d.offer),F=o.fin;
  if(k==='reject'){x.status='rejected';closeSheet();toast('Delivery rejected');return render()}
  const a=Math.round((+$('#amt').value||0)*100),earned=d.dels.filter(z=>z.status==='verified'&&z!==x).reduce((n,z)=>n+(z.amount||0),0);
  if(F.budget&&a>left(o))return toast('Only '+money(left(o),F.cur)+' is left in the budget');
  if(F.cap&&earned+a>F.cap)return toast('Over this marketer\'s cap of '+money(F.cap,F.cur));
  x.status='verified';x.amount=a;F.spent+=a;closeSheet();toast('Verified'+(a?' · '+money(a,F.cur)+' drawn from the budget':''));return render()}
 if(k==='pausedeal'){const d=S.deals.find(x=>x.id===id);d.status=d.status==='paused'?'active':'paused';return render()}
 if(k==='enddeal'){S.deals.find(x=>x.id===id).status='ended';toast('Deal ended');return render()}
 if(k==='pstart'){S.pf=el.dataset.v==='product'?{...newPF(),kind:'product',newProd:true}:el.dataset.v==='social'?{...newPF(),kind:'social'}:newPF();return render()}
 if(k==='ptype'){S.pf.type=el.dataset.v;S.pf.terms={};return render()}
 if(k==='ppick'){S.pf.pid=id;return render()}
 if(k==='npnew'){S.pf.newProd=true;return render()}
 if(k==='npcancel'){S.pf.newProd=false;return render()}
 if(k==='npcat'){S.pf.np.category=el.dataset.v;return render()}
 if(k==='npsample'){S.pf.np.sample=true;S.pf.np.img=null;return render()}
 if(k==='npsave'||(k==='pnext'&&S.pf.step===2&&S.pf.newProd)){const n=S.pf.np;if(!n.name.trim())return toast('Give the product a name');
  if(!n.img&&!n.sample)return toast('Add a placement image so marketers can see it');
  const p={id:'p'+(++S.n),owner:'u-kofi',mine:true,name:n.name.trim(),category:n.category,art:artFor(n.category),gallery:[artFor(n.category)],img:n.img,video:n.video?'0:30':null,desc:n.desc};
  S.products.push(p);toast('Product saved with its placement image');
  if(S.pf.kind==='product'){S.pf=null;return go('me')}
  S.pf.pid=p.id;S.pf.newProd=false;S.pf.np={name:'',category:'software',desc:'',img:null,video:null};return render()}
 if(k==='pback'){if(S.pf.kind==='offer'&&S.pf.newProd){S.pf.newProd=false}else if(S.pf.kind==='offer'&&S.pf.step>1)S.pf.step--;else S.pf=null;return render()}
 if(k==='pdone'){S.pf=null;toast('Saved');return render()}
 if(k==='pnext'){const P=S.pf;
  if(P.step===2&&!P.pid)return toast('Pick a product first');
  if(P.step===4&&!P.nocap){if(!(+P.budget>=1))return toast('Enter a budget, or choose no budget');if(P.cap&&+P.cap>+P.budget)return toast('The cap cannot be more than the budget')}
  if(P.step<5){P.step++;return render()}
  const p=prod(P.pid),b=budgetC(P);
  S.offers.unshift({id:'o'+(++S.n),pid:p.id,owner:'u-kofi',co:ME.seller.company,coV:true,title:P.title||'Promote '+p.name,type:P.type,terms:termsOf(P),req:{min_followers:+P.minf||0,countries:P.countries,verified_only:P.verified},desc:P.desc||p.desc,status:'open',max:10,likes:0,fin:{cur:P.cur,budget:b,cap:capC(P),funded:!!b,spent:0}});
  S.pf=null;S.fc='all';toast(b?'Payment received. Your offer is live.':'Your offer is live');return go('feed')}
}
document.addEventListener('click',e=>{
 let el;
 if(el=e.target.closest('[data-act]'))return act(el.dataset.act,el.dataset.id,el);
 if(el=e.target.closest('[data-go]'))return go(el.dataset.go);
 if(el=e.target.closest('[data-back]'))return go(S.from);
 if(el=e.target.closest('[data-fc]')){S.fc=el.dataset.fc;return render()}
 if(el=e.target.closest('[data-tab]')){S.tab=el.dataset.tab.split(' ')[0];return render()}
 if(el=e.target.closest('[data-dt]')){S.dtab=el.dataset.dt;return render()}
 if(el=e.target.closest('.slide')&&!e.target.closest('button'))return go('offer-'+el.dataset.id);
});
document.addEventListener('input',e=>{const P=S.pf;if(!P)return;const t=e.target;
 if(t.dataset.f){P[t.dataset.f]=t.value;if(['budget','cap'].includes(t.dataset.f)&&P.step===4){const f=$('.fin');if(f)f.outerHTML=finBlock(P)}}
 if(t.dataset.tf)P.terms[t.dataset.tf]=t.value;
 if(t.dataset.np)P.np[t.dataset.np]=t.value;
 const a=$('#aside');if(a&&P.kind==='offer')a.innerHTML=asideHtml(P)});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.file||!S.pf)return;const f=t.files[0];if(!f)return;
 if(t.dataset.file==='img'){if(f.size>5*1048576)return toast('Images can be up to 5 MB');const r=new FileReader();r.onload=()=>{S.pf.np.img=r.result;S.pf.np.sample=false;renderPlus()};r.readAsDataURL(f)}
 else{if(f.size>30*1048576)return toast('Videos can be up to 30 MB');S.pf.np.video=f.name;renderPlus()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='msg')act('send',route().a)});
render();

</script>
</body></html>
