<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Thebes</title>
<meta name="description" content="Play branded word games from small businesses. Win prizes, climb the leaderboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <section id="feed" class="view">
    <div class="topbar">
      <button type="button" data-feedtab="following">Following</button>
      <button type="button" data-feedtab="foryou" class="on">For you</button>
    </div>
    <div class="playbar"><button type="button" class="pill" data-act="stop">Done</button><button type="button" class="pill" data-act="board">Ranks</button></div>
    <div class="slides" id="slides"></div>
  </section>
  <section id="create" class="view light"></section>
  <section id="profile" class="view light"></section>
  <section id="admin" class="view light"></section>

  <nav id="nav">
    <a href="#feed" data-tab="feed"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Home</a>
    <a href="#create" data-tab="create" aria-label="Create a contest"><span class="plus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="#profile" data-tab="profile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
  </nav>

  <button type="button" class="veil" id="veil" aria-label="Close"></button>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;color:#d4d4d4;font:500 15px system-ui,sans-serif;pointer-events:none">Loading Thebes…</div>
<noscript><p style="color:#fff;padding:24px;font-family:system-ui">Thebes needs JavaScript turned on.</p></noscript>
<script>
  // if the app has not started in 15 s, or a script fails, say so instead of loading forever
  window.__bootFail = function (msg) {
    var b = document.getElementById('boot'); if (!b) return;
    b.style.pointerEvents = 'auto';
    b.innerHTML = '<div><p style="margin:0 0 14px">' + msg + '</p><button onclick="location.reload()" style="height:44px;padding:0 20px;border-radius:999px;border:0;background:#e65078;color:#141414;font:700 15px system-ui">Try again</button></div>';
  };
  window.__bootTimer = setTimeout(function () { window.__bootFail('Thebes is taking too long to load. Check your connection and try again.'); }, 15000);
  window.addEventListener('error', function (e) { if (document.getElementById('boot')) window.__bootFail('Something went wrong loading Thebes: ' + (e.message || 'script error')); });
</script>
<script nomodule>window.__bootFail && window.__bootFail('This browser is too old for Thebes. Please update it, or try Chrome or Safari.');</script>
<script src="/app.js" type="module"></script>
</body>
</html>
