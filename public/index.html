<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Thebes</title>
<meta name="description" content="Play branded word games from small businesses. Win prizes, climb the leaderboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <section id="feed" class="view">
    <div class="topbar">
      <button type="button" data-feedtab="following">Following</button>
      <button type="button" data-feedtab="foryou" class="on">For you</button>
    </div>
    <div class="playbar"><button type="button" class="pill" data-act="stop">Done</button><button type="button" class="pill" data-act="board">Ranks</button></div>
    <div class="slides" id="slides"></div>
  </section>
  <section id="create" class="view light"></section>
  <section id="profile" class="view light"></section>
  <section id="admin" class="view light"></section>

  <nav id="nav">
    <a href="#feed" data-tab="feed"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Home</a>
    <a href="#create" data-tab="create" aria-label="Create a contest"><span class="plus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="#profile" data-tab="profile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
  </nav>

  <button type="button" class="veil" id="veil" aria-label="Close"></button>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
