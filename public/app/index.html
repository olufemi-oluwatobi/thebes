<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050515">
<title>Gorilla Squad</title>
<meta name="description" content="Share products in your local network and get paid on proven results.">
<link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-700-normal.woff2" crossorigin>
<link rel="stylesheet" href="/squad.css">
</head>
<body>
<div id="app" aria-live="polite">
  <div class="boot" id="boot">Loading the squad…</div>
</div>
<nav id="nav" class="nav" aria-label="Main"></nav>
<script>
  // if the app has not started in 15 seconds, say so instead of loading forever
  setTimeout(function () {
    var b = document.getElementById('boot');
    if (b) b.textContent = 'Gorilla Squad is taking too long to load. Check your connection and reload.';
  }, 15000);
</script>
<script src="/vendor/qrcode.js"></script>
<script type="module" src="/squad.js"></script>
</body>
